<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GarysTV</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand" id="brand" title="Home"><img class="mark" src="logo.jpg" alt="">Garys<span class="tv">TV</span></div>
      <nav class="topnav" id="topnav">
        <span class="nav" data-key="top-back" data-top="back" title="Back (Esc)">‹ Back</span><span class="nav" data-key="top-home" data-top="home">Home</span><span class="nav" data-key="top-guide" data-top="guide">Guide</span><span class="nav" data-key="top-search" data-top="search">Search</span><span class="nav" data-key="top-menu" data-top="menu" title="Menu (hold OK, or M)">☰ Menu</span>
      </nav>
      <div class="crumb" id="crumb"></div>
      <div class="spacer"></div>
      <div class="rec-indicator" id="recInd"><span class="dot pulse"></span><span id="recText">Recording</span></div>
      <div class="clock" id="clock"></div>
    </header>
    <main id="view"></main>
    <footer class="hints" id="hints"></footer>
  </div>
  <div id="screen"><video id="video" autoplay></video><div class="osd" id="osd"></div></div>
  <script src="/lib/mpegts.js"></script>
  <script src="/lib/hls.js"></script>
  <script src="common.js"></script>
  <script src="player.js"></script>
  <script src="guide.js"></script>
  <script src="views.js"></script>
  <script src="library.js"></script>
  <script src="updates.js"></script>
  <script src="settings.js"></script>
  <script src="app.js"></script>
</body>
</html>
