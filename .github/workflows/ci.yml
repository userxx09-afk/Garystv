name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # The Windows app's Electron isn't needed to test the engine or build the TV apps.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  # Every build has its own version, so the apps can tell an update from what they have.
  GTV_VERSION: 0.2.${{ github.run_number }}

jobs:
  engine:
    name: Engine tests + Linux installer check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm test
      - name: Check the Linux installer script
        run: bash -n install/install-linux.sh && shellcheck install/install-linux.sh

  firetv:
    name: Fire TV app (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Copy the screens into the app
        run: npm run firetv
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest ships the Android SDK with ANDROID_HOME set.
      - uses: gradle/actions/setup-gradle@v4
      # The same key every build, so a new APK installs over the old one.
      - name: Signing key
        env:
          KEY_B64: ${{ secrets.GTV_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEY_B64" ]; then
            echo "::warning::No GTV_KEYSTORE_B64 secret: this APK won't install over the last one (uninstall first)."
          else
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/garystv.keystore"
            echo "GTV_KEYSTORE=$RUNNER_TEMP/garystv.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: firetv
        env:
          GTV_VERSION_CODE: ${{ github.run_number }}
          GTV_VERSION_NAME: ${{ env.GTV_VERSION }}
          GTV_KEYSTORE_PASSWORD: ${{ secrets.GTV_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: GarysTV-FireTV-apk
          path: firetv/app/build/outputs/apk/release/*.apk

  windows:
    name: Windows app (installer)
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build installer
        run: |
          npm version $env:GTV_VERSION --no-git-tag-version --allow-same-version
          npx electron-builder --win --publish never
          # latest.yml is what the installed app reads to find and check an update.
          if (!(Test-Path dist/latest.yml)) { throw "electron-builder made no latest.yml" }
      - uses: actions/upload-artifact@v4
        with:
          name: GarysTV-Windows-installer
          path: |
            dist/GarysTV-Setup-*.exe
            dist/GarysTV-Setup-*.exe.blockmap
            dist/latest.yml

  # The central place updates come from: a GitHub Release per change to main, holding the
  # Fire TV / Android APK (with version.json, which the app checks) and the Windows installer
  # (with latest.yml, which the Windows app checks). The newest Release is the update.
  release:
    name: Publish the update (GitHub Release)
    needs: [engine, firetv, windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.GTV_KEYSTORE_B64 != '' }}
          CODE: ${{ github.run_number }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning::Not published: without the GTV_KEYSTORE_B64 secret the APK can't update the installed app."
            exit 0
          fi
          mkdir rel
          cp out/GarysTV-FireTV-apk/*.apk rel/GarysTV.apk
          cp out/GarysTV-Windows-installer/* rel/
          echo "{\"version\":\"$GTV_VERSION\",\"code\":$CODE,\"apk\":\"GarysTV.apk\"}" > rel/version.json
          # A re-run of the same build replaces its Release.
          gh release delete "v$GTV_VERSION" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$GTV_VERSION" rel/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "GarysTV $GTV_VERSION" --notes "${NOTES:-Update}" --latest
