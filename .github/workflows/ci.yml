name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # The Windows app's Electron isn't needed to test the engine or build the TV apps.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  # Every build has its own version, so the apps can tell an update from what they have.
  GTV_VERSION: 0.2.${{ github.run_number }}

jobs:
  engine:
    name: Engine tests + Linux installer check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm test
      - name: Check the Linux installer scripts
        run: bash -n install/install-linux.sh && bash -n install/update-linux.sh && bash -n install/nas-linux.sh && shellcheck install/install-linux.sh install/update-linux.sh install/nas-linux.sh
      # What a home server downloads to update itself (install/update-linux.sh).
      - name: Home server files
        run: |
          npm version "$GTV_VERSION" --no-git-tag-version --allow-same-version
          tar -czf GarysTV-linux.tar.gz src headless.js package.json package-lock.json install
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1   # only passes files to the release; Actions storage is small
          name: GarysTV-linux
          path: GarysTV-linux.tar.gz

  firetv:
    name: Fire TV app (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Copy the screens into the app
        run: npm run firetv
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest ships the Android SDK with ANDROID_HOME set.
      - uses: gradle/actions/setup-gradle@v4
      # The same key every build, so a new APK installs over the old one.
      - name: Signing key
        env:
          KEY_B64: ${{ secrets.GTV_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEY_B64" ]; then
            echo "::warning::No GTV_KEYSTORE_B64 secret: this APK won't install over the last one (uninstall first)."
          else
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/garystv.keystore"
            echo "GTV_KEYSTORE=$RUNNER_TEMP/garystv.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: firetv
        env:
          GTV_VERSION_CODE: ${{ github.run_number }}
          GTV_VERSION_NAME: ${{ env.GTV_VERSION }}
          GTV_KEYSTORE_PASSWORD: ${{ secrets.GTV_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:lintRelease
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1   # only passes files to the release; Actions storage is small
          name: GarysTV-FireTV-apk
          path: firetv/app/build/outputs/apk/release/*.apk

  windows:
    name: Windows app (installer)
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build installer
        run: |
          npm version $env:GTV_VERSION --no-git-tag-version --allow-same-version
          npx electron-builder --win --publish never
          # latest.yml is what the installed app reads to find and check an update.
          if (!(Test-Path dist/latest.yml)) { throw "electron-builder made no latest.yml" }
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1   # only passes files to the release; Actions storage is small
          name: GarysTV-Windows-installer
          path: |
            dist/GarysTV-Setup-*.exe
            dist/GarysTV-Setup-*.exe.blockmap
            dist/latest.yml

  # The newer Linux Fire TV sticks (Vega OS) can't run the APK. Their app is built with Amazon's
  # Vega SDK, which runs only on Ubuntu or Mac (vega/README.md). New and unproven, so a failure
  # here doesn't hold back the other updates.
  vega:
    name: Vega Fire TV app (.vpkg)
    continue-on-error: true
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ubuntu packages the Vega SDK asks for (developer.amazon.com/docs/vega/.../install-vega-sdk).
      - name: SDK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq build-essential lz4
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y libpython3.8-dev
      - name: Install the Vega SDK
        env:
          CI: "true"
        run: |
          curl -fsSL https://sdk-installer.vega.labcollab.net/get_vvm.sh -o "$RUNNER_TEMP/get_vvm.sh"
          # The installer asks questions (install folder...): Enter keeps each default.
          yes '' | bash "$RUNNER_TEMP/get_vvm.sh" || echo "::warning::installer exited non-zero"
          export PATH="$HOME/vega/bin:$PATH"
          [ -f ~/vega/env ] && source ~/vega/env
          vega --help || true
          vega sdk --help || true
          vega sdk list-installed || true
          if ! vega sdk list-installed 2>/dev/null | grep -q '[0-9]'; then
            vega sdk list-remote || true
            yes '' | vega sdk install || yes y | vega sdk install
          fi
          vega --version
          echo "$HOME/vega/bin" >> "$GITHUB_PATH"
          # Everything the SDK's env sets, for the later steps.
          bash -c 'source ~/vega/env && env' | grep -E '^(VEGA|KEPLER|PATH)' | grep -v '^PATH=' >> "$GITHUB_ENV" || true
      - name: Make the app
        run: |
          [ -f ~/vega/env ] && source ~/vega/env
          vega project list-templates || true
          vega project generate --template vegaWebview --name garystv --packageId com.garystv.tv --outputDir "$RUNNER_TEMP/garystv"
          echo "--- template files"; (cd "$RUNNER_TEMP/garystv" && find . -path ./node_modules -prune -o -type f -print | head -80)
          echo "--- template manifest"; cat "$RUNNER_TEMP/garystv/manifest.toml"
          GTV_BUILD=${{ github.run_number }} node vega/build.js "$RUNNER_TEMP/garystv"
          echo "--- our manifest"; cat "$RUNNER_TEMP/garystv/manifest.toml"
      - name: Build .vpkg
        working-directory: ${{ runner.temp }}/garystv
        run: |
          [ -f ~/vega/env ] && source ~/vega/env
          # The app with saved-server + network packages; if those won't build, the plain one.
          if ! (npm install && npm run build:app); then
            echo "::warning::Vega app with saved server didn't build; building the plain one."
            GTV_VEGA_PLAIN=1 GTV_BUILD=${{ github.run_number }} node "$GITHUB_WORKSPACE/vega/build.js" "$PWD"
            npm install && npm run build:app
          fi
          find build -name '*.vpkg' -exec ls -la {} \;
          mkdir -p "$GITHUB_WORKSPACE/out"
          for f in $(find build -name '*.vpkg'); do cp "$f" "$GITHUB_WORKSPACE/out/"; done
          ls "$GITHUB_WORKSPACE/out"/*.vpkg
          # What's inside (the screens must be in assets/www).
          for f in "$GITHUB_WORKSPACE"/out/*armv7*.vpkg; do file "$f"; (tar -tvf "$f" 2>/dev/null || unzip -l "$f" 2>/dev/null || true) | head -60; done
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1   # only passes files to the release
          name: GarysTV-Vega-vpkg
          path: out/*.vpkg

  # The central place updates come from: a GitHub Release per change to main, holding the
  # Fire TV / Android APK (with version.json, which the app checks) and the Windows installer
  # (with latest.yml, which the Windows app checks). The newest Release is the update.
  release:
    name: Publish the update (GitHub Release)
    needs: [engine, firetv, windows, vega]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish
        env:
          OWN_TOKEN: ${{ github.token }}
          PROD_TOKEN: ${{ secrets.PROD_REPO_TOKEN }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
          HAS_KEY: ${{ secrets.GTV_KEYSTORE_B64 != '' }}
          CODE: ${{ github.run_number }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning::Not published: without the GTV_KEYSTORE_B64 secret the APK can't update the installed app."
            exit 0
          fi
          mkdir rel
          cp out/GarysTV-FireTV-apk/*.apk rel/GarysTV.apk
          cp out/GarysTV-Windows-installer/* rel/
          cp out/GarysTV-linux/GarysTV-linux.tar.gz rel/
          # Vega Fire TV sticks (installed with the Vega CLI; see vega/README.md). Fire TV Sticks are armv7.
          V=$(ls out/GarysTV-Vega-vpkg/*armv7*.vpkg 2>/dev/null | head -1)
          if [ -n "$V" ]; then cp "$V" rel/GarysTV-Vega.vpkg; else echo "::warning::No Vega app this time (the Vega job failed)."; fi
          SUM="$(sha256sum rel/GarysTV-linux.tar.gz | cut -d' ' -f1)"
          echo "{\"version\":\"$GTV_VERSION\",\"code\":$CODE,\"apk\":\"GarysTV.apk\",\"linux\":\"GarysTV-linux.tar.gz\",\"linuxSha256\":\"$SUM\"}" > rel/version.json
          # Installable builds live in the public, releases-only prod repo (this source repo
          # is private). One Release per build, plus "garystv-latest", whose fixed address
          # every installed app, the Windows updater and the home server check.
          if [ -z "$PROD_TOKEN" ]; then
            echo "::error::No PROD_REPO_TOKEN secret: can't publish to userxx09-afk/prod."
            exit 1
          fi
          export GH_TOKEN="$PROD_TOKEN"
          PROD=userxx09-afk/prod
          gh release delete "garystv-v$GTV_VERSION" --repo "$PROD" --yes --cleanup-tag 2>/dev/null || true
          gh release create "garystv-v$GTV_VERSION" rel/* --repo "$PROD" --target main --title "GarysTV $GTV_VERSION" --notes "${NOTES:-Update}" --latest=false
          gh release delete garystv-latest --repo "$PROD" --yes --cleanup-tag 2>/dev/null || true
          gh release create garystv-latest rel/* --repo "$PROD" --target main --title "GarysTV (latest: $GTV_VERSION)" --notes "Always the newest GarysTV. Fire TV: https://github.com/$PROD/releases/download/garystv-latest/GarysTV.apk" --latest=false

          # Transition: installs from before this change still look in this repo's own
          # Releases, so keep publishing here while the repo is public - the update they get
          # points them at prod. Stops by itself once the repo is made private.
          if [ "$REPO_PRIVATE" != "true" ]; then
            export GH_TOKEN="$OWN_TOKEN"
            gh release delete "v$GTV_VERSION" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
            gh release create "v$GTV_VERSION" rel/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "GarysTV $GTV_VERSION" --notes "${NOTES:-Update}" --latest
          fi
