<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GarysTV</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="tv.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><img class="mark" src="logo.jpg" alt="">Garys<span class="tv">TV</span></div>
      <div class="crumb" id="crumb"></div>
      <div class="spacer"></div>
      <div class="rec-indicator" id="recInd"><span class="dot pulse"></span><span id="recText">Recording</span></div>
      <div class="clock" id="clock"></div>
    </header>
    <main id="view"></main>
    <footer class="hints" id="hints"></footer>
  </div>
  <div id="screen"><video id="video" autoplay></video><div class="osd" id="osd"></div></div>
  <script src="tv.js"></script>
  <script src="lib/mpegts.js"></script>
  <script src="lib/hls.js"></script>
  <script src="common.js"></script>
  <script src="player.js"></script>
  <script src="guide.js"></script>
  <script src="views.js"></script>
  <script src="settings.js"></script>
  <script src="app.js"></script>
</body>
</html>
